# EV-Voluntary-Registration-Form — backend (Go)
#
# ⚠️ LOCAL DEV ONLY — ไฟล์นี้ **ไม่ใช่ deployment path** อีกต่อไป
# ของจริง deploy ด้วย GitLab CI (build image) → Argo CD → Helm chart บน k8s
# ดู README.md / MIGRATION-PLAN.md · ห้ามเอา credential หรือ config ในไฟล์นี้
# ไปอ้างเป็นค่าที่รันบน dev/uat/prod (บน k8s ค่ามาจาก ConfigMap/Secret + Vault
# และ Postgres เป็น service แยก ไม่ใช่ container ในไฟล์นี้)
version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: pea_user
      POSTGRES_PASSWORD: 1234567
      POSTGRES_DB: Test_PEA_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pea_user -d Test_PEA_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: auth-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
